.github/workflows/ci-cd.yml
# Pipeline CI/CD — TP2 DevOps HESTIM
# À chaque push sur main : tests, construction de l'image (amd64 + arm64), publication sur ghcr.io
name: CI/CD
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
  packages: write
 
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/todo-app-devops
 
jobs:
  test:
    name: Tests (étape test du Dockerfile)
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
 
      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4
 
      - name: Lancer les tests dans un conteneur
        run: docker build --target test --progress plain .
 
  build-push:
    name: Construire et publier l'image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
 
      - name: Préparer l'émulation multi-architecture (QEMU)
        uses: docker/setup-qemu-action@v4
 
      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4
 
      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
 
      - name: Construire et pousser l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
