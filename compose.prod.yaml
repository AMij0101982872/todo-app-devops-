# Déploiement de l'image publiée par le pipeline (TP2 DevOps HESTIM)
services:
  app:
    image: ghcr.io/azeddinekhiat/todo-app-devops:latest
    ports:
      - 8080:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/greeting').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - todo-data:/etc/todos

volumes:
  todo-data:
